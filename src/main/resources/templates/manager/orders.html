<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechCycle - View Orders</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .table-wrapper { overflow-x: auto; }
    table { min-width: 1000px; }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">

<!-- Top navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
  <div class="container px-4 px-lg-5">
    <span class="navbar-brand fw-bold">TechCycle</span>
    <span class="badge bg-secondary ms-2">Sales Manager</span>
  </div>
</nav>
<!-- Header -->
<header class="bg-dark py-4">
  <div class="container px-4 px-lg-5">
    <div class="text-white">
      <h1 class="h3 fw-bold mb-1">View Orders</h1>
      <p class="text-white-50 mb-0">Προβολή όλων των παραγγελιών πελατών του οργανισμού.</p>
    </div>
  </div>
</header>

<main class="py-4 flex-grow-1">
  <div class="container-fluid px-4 px-lg-5">
    <div class="card shadow-sm">
      <div class="card-body">

        <h5 class="fw-semibold mb-3">Λίστα Παραγγελιών</h5>

        <!-- No orders message -->
        <div th:if="${orders == null || #lists.isEmpty(orders)}" class="alert alert-secondary">
          Δεν υπάρχουν παραγγελίες.
        </div>

        <!-- Orders table -->
        <div class="table-wrapper" th:if="${orders != null && !#lists.isEmpty(orders)}">
          <table class="table table-striped align-middle text-center">
            <thead class="table-dark">
            <tr>
              <th>OrderID</th>
              <th>Payment Method</th>
              <th>Shopping Cart ID</th>
              <th>Customer Username</th>
              <th>Customer Email</th>
              <th>Home Address</th>
              <th>Total Price</th>
              <th>Date</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
              <td th:text="${order.orderId}"></td>
              <td th:text="${order.paymentMethod}"></td>
              <td th:text="${order.shoppingCartId}"></td>
              <td th:text="${order.customerUsername}"></td>
              <td th:text="${order.customerEmail}"></td>
              <td th:text="${order.homeAddress}"></td>
              <td th:text="${'€' + #numbers.formatDecimal(order.totalPrice, 1, 2)}"></td>
              <td th:text="${order.dateOrder}"></td>
            </tr>
            </tbody>

          </table>
        </div>

      </div>
    </div>
  </div>
</main>
<!-- Footer -->
<footer class="py-4 bg-dark mt-auto">
  <div class="container">
    <p class="m-0 text-center text-white">© TechCycle</p>
  </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
