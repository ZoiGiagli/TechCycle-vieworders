spring.application.name=TechCycle-vieworders
server.port=8080

# H2 embedded database (file-based)
spring.datasource.url=jdbc:h2:file:./data/techcycle_vieworders;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Initialize DB using schema.sql and data.sql
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true



